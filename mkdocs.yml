site_name: GENis
site_description: Documentación funcional del sistema GENis
site_url: https://ferorti.github.io/genis-doc/
repo_url: https://github.com/fundacion-sadosky/genis
repo_name: fundacion-sadosky/genis
edit_uri: ""
docs_dir: docs

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/nav-fix.js

theme:
  name: material
  logo: images/assets/icono.svg
  language: es
  icon:
    repo: fontawesome/brands/github
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Cambiar al modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Cambiar al modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Cambiar al modo automático
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.tooltips

plugins:
  - search:
      lang: es
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      languages:
        - locale: es
          name: Español
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            GENis: GENis
            Funcionalidades del sistema: System functionalities
            Fundamentos de genética forense: Forensic genetics foundations
            Estándares y mejores prácticas: Standards and best practices
            Declaración de principios: Declaration of principles
            Usos forenses: Forensic uses
            Investigación criminal: Criminal investigation
            Búsqueda de personas (MPI): Missing persons search (MPI)
            Identificación de víctimas de desastres (DVI): Disaster victim identification (DVI)
            Instalación: Installation
            Requerimientos del sistema: System requirements
            Instalación con Docker: Installation with Docker
            Instalación manual: Manual installation
            Instalación de sistema base: Base system installation
            Instalación de GENis: GENis installation
            Configuración de RAID: RAID configuration
            Hardening de seguridad: Security hardening
            Registro de control de cambios: Change control log
            Administración: Administration
            Solicitar una cuenta: Requesting an account
            Roles: Roles
            Laboratorios: Laboratories
            Genetistas: Geneticists
            Tipos de materiales biológicos: Types of biological materials
            Categorías: Categories
            Kits: Kits
            Marcadores: Markers
            Bases de datos de frecuencias: Frequency databases
            Mitocondrial: Mitochondrial
            Auditoría: Audit
            Notificaciones: Notifications
            Tipificación de motivos: Reason coding
            Reportes: Reports
            Búsqueda de perfiles: Profile search
            Alta de perfiles: Profile registration
            Baja de perfiles: Profile deactivation
            Comparador de perfiles: Profile comparator
            Exportador de perfiles: Profile exporter
            Gestor de coincidencias y cálculos forense: Match manager and forensic calculations
            Coincidencia de perfiles: Profile matching
            Búsqueda de personas: Missing persons search
            Interconexión de instancias: Instance interconnection
            Anexos técnicos: Technical annexes
            Anexo I - Algoritmo de búsqueda de coincidencias de STR: Annex I - STR match search algorithm
            Anexo II - Gestor de coincidencias y cálculos estadísticos por default: Annex II - Match manager and default statistical calculations
            Anexo III - Interpretación de estadísticas de evidencias: Annex III - Interpretation of evidence statistics
            Anexo IV - Errores frecuentes y diccionario de errores: Annex IV - Frequent errors and error dictionary
            Anexo V - Marco de seguridad y protección de datos personales: Annex V - Security and personal data protection framework
  - glightbox:
      touchNavigation: true
      loop: false
      effect: fade
      slide_effect: slide
      width: 90%
      height: auto
      zoomable: true
      draggable: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fundacion-sadosky
      name: Fundación Sadosky en GitHub

copyright: >
  <a href="https://www.fundacionsadosky.org.ar" target="_blank" rel="noopener">Fundación Sadosky</a>

nav:
  - GENis:
      - GENis: index.md
      - Usos forenses:
          - Usos forenses: usos_forenses/index.md
          - Investigación criminal: usos_forenses/investigacion_criminal.md
          - Búsqueda de personas (MPI): usos_forenses/busqueda_de_personas_mpi.md
          - Identificación de víctimas de desastres (DVI): usos_forenses/identificacion_de_victimas_dvi.md
      - Funcionalidades del sistema: genis/funcionalidades_del_sistema.md
      - Fundamentos de genética forense: genis/genetica_forense.md
      - Declaración de principios: genis/declaracion_de_principios.md
      - Estándares y mejores prácticas: genis/estandares_y_mejores_practicas.md
  - Instalación:
      - Instalación de contenedores: instalacion/instalacion_de_contenedores.md
      - Datos iniciales de GENis: instalacion/datos_iniciales.md
      - Despliegue en producción: instalacion/despliegue_en_produccion.md
      - Resguardo y recuperación: instalacion/resguardo_y_recuperacion.md
      - Utilidades de desarrollo: instalacion/utilidades_de_desarrollo.md
      - Configuración de RAID: instalacion/configuracion_de_raid.md
      - Hardening de seguridad: instalacion/hardening_de_seguridad.md
      - Registro de control de cambios: instalacion/registro_de_control_de_cambios.md
  - Administración:
      - Solicitar una cuenta: administracion/solicitar_una_cuenta.md
      - Roles: administracion/roles.md
      - Laboratorios: administracion/laboratorios.md
      - Genetistas: administracion/genetistas.md
      - Tipos de materiales biológicos: administracion/tipos_de_materiales_biologicos.md
      - Categorías: administracion/categorias.md
      - Kits: administracion/kits.md
      - Marcadores: administracion/marcadores.md
      - Bases de datos de frecuencias: administracion/bases_de_datos_de_frecuencias.md
      - Mitocondrial: administracion/mitocondrial.md
      - Auditoría: administracion/auditoria.md
      - Notificaciones: administracion/notificaciones.md
      - Tipificación de motivos: administracion/tipificacion_de_motivos.md
      - Reportes: administracion/reportes.md
  - Búsqueda de perfiles:
      - Alta de perfiles: busqueda_de_perfiles/alta_de_perfiles.md
      - Baja de perfiles: busqueda_de_perfiles/baja_de_perfiles.md
      - Comparador de perfiles: busqueda_de_perfiles/comparador_de_perfiles.md
      - Exportador de perfiles: busqueda_de_perfiles/exportador_de_perfiles.md
      - Gestor de coincidencias y cálculos forense: busqueda_de_perfiles/gestor_de_coincidencias_y_calculos_forense.md
      - Coincidencia de perfiles: busqueda_de_perfiles/coincidencia_de_perfiles.md
      - Búsqueda de personas: busqueda_de_perfiles/busqueda_de_personas.md
      - Interconexión de instancias: busqueda_de_perfiles/interconexion_de_instancias.md
  - Anexos técnicos:
      - Anexo I - Algoritmo de búsqueda de coincidencias de STR: anexos/anexo_i_algoritmo_de_busqueda_de_coincidencias_de_str.md
      - Anexo II - Gestor de coincidencias y cálculos estadísticos por default: anexos/anexo_ii_gestor_de_coincidencias_y_calculos_estadisticos_por_default.md
      - Anexo III - Interpretación de estadísticas de evidencias: anexos/anexo_iii_interpretacion_de_estadisticas_de_evidencias.md
      - Anexo IV - Errores frecuentes y diccionario de errores: anexos/anexo_iv_errores_frecuentes_y_diccionario_de_errores.md
      - Anexo V - Marco de seguridad y protección de datos personales: anexos/anexo_v_marco_de_seguridad_y_proteccion_de_datos_personales.md